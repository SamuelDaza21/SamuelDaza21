<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="220" viewBox="0 0 1200 220">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="55%" stop-color="#11161e"/>
      <stop offset="100%" stop-color="#0d1117"/>
    </linearGradient>
    <radialGradient id="orbA">
      <stop offset="0%" stop-color="#d4a84b" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#d4a84b" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="orbB">
      <stop offset="0%" stop-color="#8b949e" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#8b949e" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="title" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8b949e"/>
      <stop offset="30%" stop-color="#d4a84b"/>
      <stop offset="55%" stop-color="#e6edf3"/>
      <stop offset="80%" stop-color="#d4a84b"/>
      <stop offset="100%" stop-color="#8b949e"/>
    </linearGradient>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="1200" height="220" fill="url(#bg)"/>

  <circle cx="200" cy="70" r="150" fill="url(#orbA)">
    <animate attributeName="cx" values="200;290;200" dur="15s" repeatCount="indefinite"/>
    <animate attributeName="cy" values="70;110;70" dur="19s" repeatCount="indefinite"/>
  </circle>
  <circle cx="1010" cy="160" r="170" fill="url(#orbB)">
    <animate attributeName="cx" values="1010;920;1010" dur="17s" repeatCount="indefinite"/>
    <animate attributeName="cy" values="160;120;160" dur="23s" repeatCount="indefinite"/>
  </circle>
  <circle cx="620" cy="30" r="90" fill="url(#orbA)">
    <animate attributeName="cx" values="620;680;620" dur="21s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.6;1;0.6" dur="9s" repeatCount="indefinite"/>
  </circle>

  <text x="600" y="104" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="56" font-weight="600" fill="url(#title)" filter="url(#glow)">
    Samuel Daza
  </text>
  <text x="600" y="148" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="21" fill="#8b949e" letter-spacing="2">
    DESARROLLADOR DE SOFTWARE · INGENIERÍA DE SISTEMAS
  </text>

  <rect y="206" width="1200" height="2" fill="#d4a84b">
    <animate attributeName="opacity" values="0.15;0.55;0.15" dur="6s" repeatCount="indefinite"/>
  </rect>
</svg>
